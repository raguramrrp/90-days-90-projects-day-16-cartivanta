<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &bull; CARTIVANTA Retail Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-8 space-y-6">

        <!-- Logo & Branding -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-emerald-600 rounded-xl mx-auto flex items-center justify-center text-white font-extrabold text-2xl shadow-sm">
                C
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">CARTIVANTA</h1>
            <p class="text-xs text-slate-500 font-medium">Run Your Shop. Track Your Stock. Understand Your Profit.</p>
        </div>

        {% if error %}
        <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Username / Phone</label>
                <input type="text" name="username" id="login-username" required placeholder="admin or cashier" 
                       class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" id="login-password" required placeholder="••••••••" 
                       class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-lg shadow-sm transition">
                Sign In to Shop
            </button>
        </form>

        <!-- 1-Click Fast Demo Login Buttons -->
        <div class="pt-4 border-t border-slate-100 space-y-2">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block text-center">Instant 1-Click Demo Login</span>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="fillAndSubmit('admin', 'admin123')" class="p-2 border border-slate-200 bg-white hover:bg-slate-50 text-slate-800 rounded-lg font-bold text-center transition shadow-xs">
                    Login as Owner
                </button>
                <button onclick="fillAndSubmit('cashier', 'cashier123')" class="p-2 border border-slate-200 bg-white hover:bg-slate-50 text-slate-800 rounded-lg font-bold text-center transition shadow-xs">
                    Login as Cashier
                </button>
            </div>
            <p class="text-[10px] text-slate-400 text-center mt-1">Credentials pre-configured in local secure database</p>
        </div>

    </div>

    <script>
        function fillAndSubmit(user, pass) {
            document.getElementById('login-username').value = user;
            document.getElementById('login-password').value = pass;
            document.querySelector('form').submit();
        }
    </script>
</body>
</html>
